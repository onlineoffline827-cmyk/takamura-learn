
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LOGIN - TAKAMURA LEARN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>TAKAMURA LEARN</h1>
        <p>LEARN • UNDERSTAND • SUCCEED</p>

        <nav>
            <a href="index.html">HOME</a>
            <a href="about.html">ABOUT</a>
            <a href="login.html">LOGIN</a>
        </nav>

        <button id="languageBtn">🇸🇴 SOMALI</button>
    </header>

    <main>
        <section class="hero">

            <h2>CHOOSE YOUR LOGIN</h2>

            <p>
                Welcome to TAKAMURA LEARN.
                Choose your account type to continue.
            </p>

            <!-- STUDENT LOGIN -->

            <div class="login-box">

                <h2>STUDENT LOGIN</h2>

                <p>Access your learning portal.</p>

                <form id="studentLoginForm">

                    <label for="email">GMAIL ADDRESS</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your Gmail"
                        required
                    >

                    <label for="studentPassword">PASSWORD</label>

                    <input
                        type="password"
                        id="studentPassword"
                        placeholder="Enter your password"
                        required
                    >

                    <button type="submit" class="enter-btn">
                        STUDENT LOGIN
                    </button>

                </form>

            </div>

            <!-- ADMIN LOGIN -->

            <div class="login-box">

                <h2>ADMIN LOGIN</h2>

                <p>Private administration access.</p>

                <form id="adminLoginForm">

                    <label for="adminEmail">ADMIN EMAIL</label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required
                    >

                    <label for="adminPassword">PASSWORD</label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required
                    >

                    <button type="submit" class="enter-btn">
                        ADMIN LOGIN
                    </button>

                </form>

            </div>

        </section>
    </main>

    <footer>
        <p>© 2026 TAKAMURA LEARN</p>
        <p>Learn something new every day.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>

</body>
</html>
