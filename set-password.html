
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SET PASSWORD - TAKAMURA LEARN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>TAKAMURA LEARN</h1>
        <p>CREATE YOUR STUDENT PASSWORD</p>
    </header>

    <main>
        <section class="hero">

            <div class="login-box">

                <h2>SET YOUR PASSWORD</h2>

                <p>Create a secure password for your student account.</p>

                <form id="passwordForm">

                    <label for="newPassword">NEW PASSWORD</label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        minlength="8"
                        required
                    >

                    <label for="confirmPassword">CONFIRM PASSWORD</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="8"
                        required
                    >

                    <button type="submit" class="enter-btn">
                        SAVE PASSWORD
                    </button>

                </form>

                <p id="message"></p>

            </div>

        </section>
    </main>

    <footer>
        <p>© 2026 TAKAMURA LEARN</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        const form = document.getElementById("passwordForm");
        const message = document.getElementById("message");

        async function checkInvitation() {
            const { data, error } =
                await supabaseClient.auth.getSession();

            if (error || !data.session) {
                message.textContent =
                    "Please open the invitation link sent to your email.";

                form.querySelector("button").disabled = true;
            }
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const password =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password.length < 8) {
                message.textContent =
                    "Password must contain at least 8 characters.";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent =
                    "Passwords do not match.";
                return;
            }

            const button = form.querySelector("button");
            button.disabled = true;

            try {
                const { error } =
                    await supabaseClient.auth.updateUser({
                        password: password
                    });

                if (error) throw error;

                message.textContent =
                    "Password saved! You can now log in.";

                await supabaseClient.auth.signOut();

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);

            } catch (error) {
                message.textContent = error.message;
                button.disabled = false;
            }
        });

        checkInvitation();
    </script>

</body>
</html>
